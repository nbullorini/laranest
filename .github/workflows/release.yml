# Publishes Laranest itself when a version tag is pushed (`make publish`).
# Each release is a new semver tag (v0.1.1, v0.2.0…); the binaries embed the
# commit too (v0.1.1+abc1234). Re-pushing a tag replaces its release.
# Tags with a suffix (v1.2.0-rc.1) become pre-releases. The PHP builds live in
# their own rolling "php" release (php.yml) and are not rebuilt here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # to read the CI run of the tagged commit

jobs:
  # Never publish a commit that didn't pass CI. Like Laravel's repos, don't
  # run it again: wait for (or read) the CI that ran when it was pushed to
  # main, so `make publish` works right after the push.
  ci-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to compare with the last tested commit

      - name: Wait for the CI of ${{ github.sha }} on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # ci.yml skips commits that only touch docs or php/ (paths-ignore):
          # then the latest green CI on main counts, if nothing else changed since.
          only_ignored() {
            git diff --name-only "$1" "$GITHUB_SHA" | grep -vE '\.md$|^php/|^\.github/workflows/php\.yml$' | grep -q . && return 1
            return 0
          }
          for i in $(seq 120); do
            run=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push -L 1 \
              --json databaseId,status,conclusion -q '.[0]')
            if [ -z "$run" ]; then
              if [ "$i" -ge 6 ]; then # a minute for the push's CI to show up
                last=$(gh run list --workflow ci.yml --branch main --event push --status success -L 1 --json headSha -q '.[0].headSha')
                if [ -n "$last" ] && git merge-base --is-ancestor "$last" "$GITHUB_SHA" && only_ignored "$last"; then
                  echo "Only docs/PHP-build files changed since $last, which passed CI."; exit 0
                fi
                echo "::error::This commit never ran CI on main: push it to main first."; exit 1
              fi
            else
              status=$(jq -r .status <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run")
              echo "CI run $(jq -r .databaseId <<<"$run"): $status $conclusion"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::CI failed for this commit: not publishing."; exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI."; exit 1

  windows-e2e:
    uses: ./.github/workflows/windows-e2e.yml

  release:
    needs: [ci-passed, windows-e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        run: make ui

      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/nbullorini/laranest/internal/version.Version=${GITHUB_REF_NAME}+${GITHUB_SHA::7}" \
              -o "dist/laranest-linux-$arch" ./cmd/laranest
          done
          # Windows: the sign-in launcher is embedded into laranest.exe.
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o internal/service/laranestw.exe ./cmd/laranestw
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/nbullorini/laranest/internal/version.Version=${GITHUB_REF_NAME}+${GITHUB_SHA::7}" \
            -o dist/laranest-windows-amd64.exe ./cmd/laranest
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum laranest-* install.sh install.ps1 > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-publishing the same version replaces its release (the tag stays).
          gh release delete "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          flags="--verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" $flags \
            --title "Laranest $GITHUB_REF_NAME" \
            --notes "Build ${GITHUB_SHA::7} ($(date -u +%F)). See the commits on main for details." dist/*
