# Full end-to-end regression on native Windows (test/e2e/regression.ps1):
# PHP from windows.php.net, php-cgi workers, Job Objects, HTTPS, the CLI.
# It takes ~15 minutes, so it runs before every release (release.yml) and
# when started by hand from the Actions tab, not on every push.
name: Windows e2e

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        shell: bash
        run: |
          (cd web && npm ci && npm run build)
          go build -trimpath -ldflags "-s -w -H windowsgui" -o internal/service/laranestw.exe ./cmd/laranestw
          go build -trimpath -ldflags "-s -w" -o bin/laranest.exe ./cmd/laranest

      - name: Regression
        shell: powershell
        env:
          LARAVEL_BYPASS_ENV_CHECK: "1" # laravel-vite-plugin refuses `vite` dev servers when CI=true
        run: test\e2e\regression.ps1 -Laranest bin\laranest.exe -Root "$env:RUNNER_TEMP\regression"
